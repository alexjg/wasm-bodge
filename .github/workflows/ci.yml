name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rustflags: "" # disable default -D warnings
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy -- -D warnings

  test:
    name: Test (default panic=unwind)
    runs-on: ubuntu-latest
    env:
      WASM_BODGE_TEST_RUST_TOOLCHAIN: nightly-2026-07-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Install pinned nightly toolchain for panic=unwind
        run: |
          rustup toolchain install "$WASM_BODGE_TEST_RUST_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain "$WASM_BODGE_TEST_RUST_TOOLCHAIN"

      - name: Install wasm-bindgen-cli
        run: |
          # Download prebuilt binary instead of compiling from source
          VERSION="0.2.127"
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$VERSION/wasm-bindgen-$VERSION-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv "wasm-bindgen-$VERSION-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/
          wasm-bindgen --version

      - name: Install wasm-opt
        run: |
          VERSION="version_124"
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/$VERSION/binaryen-$VERSION-x86_64-linux.tar.gz" | tar xz
          sudo mv "binaryen-$VERSION/bin/wasm-opt" /usr/local/bin/
          wasm-opt --version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          # Current Wrangler releases require Node 22, while the runtime
          # compatibility matrix deliberately exercises Node 20.
          npm install -g esbuild wrangler@4.80.0
          cd tests/puppeteer_runner && npm install

      - name: Run tests
        run: cargo test -- --test-threads=1
