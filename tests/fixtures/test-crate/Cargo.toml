[package]
name = "test-wasm-lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "=0.2.127", features = ["std"] }
wasm-bindgen-futures = { version = "=0.4.77", features = ["std"] }

[profile.release]
debug = true

[profile.wasm-debug]
inherits = "dev"
debug = "full"
opt-level = 0
strip = "none"
